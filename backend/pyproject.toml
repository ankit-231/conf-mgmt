[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Ankit Khanal",email = "ankitkhanal231@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "django (==5.2)",
    "djangorestframework (>=3.17.2,<4.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "django-safedelete (>=1.4.1,<2.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "django-currentuser (>=0.10.0,<0.11.0)",
    "gunicorn (>=26.0.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-extensions (>=4.1,<5.0)",
    "faker (>=40.36.0,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
